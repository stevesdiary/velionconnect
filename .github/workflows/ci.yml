name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUSKY: '0'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @velion/api run prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velion
          POSTGRES_PASSWORD: velion_dev
          POSTGRES_DB: velionconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://velion:velion_dev@localhost:5432/velionconnect_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @velion/api run prisma:generate

      - name: Build API (and workspace deps)
        run: pnpm build --filter=@velion/api

      - name: Push schema to test database
        run: pnpm --filter @velion/api exec prisma db push --schema ../../prisma/schema.prisma --skip-generate

      - name: Run e2e tests
        run: pnpm --filter @velion/api run test:e2e
